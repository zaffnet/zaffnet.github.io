name: Cleanup old preview deployments

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  deployments: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete previews older than 5 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '5 days ago' +%s)
          gh api repos/${REPO}/deployments --paginate \
          | jq -c '.[] | select(.environment=="github-pages" and (.production_environment == false) and (.created_at|fromdateiso8601) < '"$cutoff"')' \
          | while read d; do
              id=$(echo "$d" | jq -r '.id')
              gh api repos/${REPO}/deployments/$id -X DELETE || true
            done
