name: Cleanup old preview deployments

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  deployments: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Compute cutoff timestamp
        id: time
        run: echo "cutoff=$(date -u -d '5 days ago' +%s)" >> "$GITHUB_OUTPUT"
      - name: Delete previews older than 5 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CUTOFF: ${{ steps.time.outputs.cutoff }}
        run: |
          gh api repos/${REPO}/deployments --paginate \
          | jq -c --argjson cutoff "$CUTOFF" '.[] | select(.environment=="github-pages" and (.created_at|fromdateiso8601) < $cutoff)' \
          | while read d; do
              id=$(echo "$d" | jq -r '.id')
              gh api repos/${REPO}/deployments/$id -X DELETE || true
            done
