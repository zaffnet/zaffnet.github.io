exclude: ^(_site/|vendor/|\.jekyll-cache/|\.bundle/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [scss, css, javascript, yaml]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args:
          [
            "--disable",
            "MD001",
            "MD007",
            "MD012",
            "MD013",
            "MD022",
            "MD023",
            "MD025",
            "MD032",
            "MD033",
            "MD036",
            "MD037",
            "MD039",
            "MD041",
            "MD045",
            "MD051",
            "--",
          ]
