<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% if page.desc %}{{ page.desc | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    {% if page.keywords == null %}<meta name="keywords" content="Deep Learning, Neural Networks, Natural Language Processing">{% else %}<meta property="keywords"  content="{{ page.keywords }}" />{% endif %}
    <meta name="author" content="zaffnet">
    <meta property="og:site_name" content="Zafar Mahmood"/>
    <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}" />
    <meta property="og:type"content="article" />
    {% if page.title == null %}<meta property="og:title" content="Zafar Mahmood" />{% else %}<meta property="og:title" content="{{ page.title }}" />{% endif %}
    <meta property="og:description" content="{% if page.desc %}{{ page.desc | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />
    {% if page.og_image_url == null %}<meta property="og:image" content="{{ '/assets/og_image.jpg' | prepend: site.baseurl | prepend: site.url }}" />{% else %}<meta property="og:image" content="{{ page.og_image_url | prepend: site.baseurl | prepend: site.url }}" />{% endif %}
    <meta property="fb:app_id" content="1351774508219707" />
    <meta name="google-site-verification" content="Ry_NIMOQWDM4ilISBn-Od4bAlgSAKWIGs1hKFyBMLbY" />
    <meta name="msvalidate.01" content="C98CDD5D490485F7384028B8A0EF655C" />
    {% if page.canonical == null %}<link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">{% else %}<link rel="canonical" href="{{ page.canonical | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">{% endif %}
    {% if page.title == null %}<title>Zafar Mahmood</title>{% else %}<title>{{ page.title }}</title>{% endif %}
    <!-- google-site-verification: googlee1a02f6d45541f17.html -->

      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');

      ga('create', 'UA-90177266-1', 'auto');
      ga('send', 'pageview');

    <link rel="icon" href="{{ "assets/favicon.ico" | absolute_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script type="importmap">
      {
        "imports": {
          "@material/web/": "https://esm.run/@material/web/"
        }
      }
    </script>
    <script type="module">
      import '@material/web/all.js';
      import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
      document.adoptedStyleSheets.push(typescaleStyles.styleSheet);

    <link href='{{ "assets/css/main.css" | absolute_url }}' rel="stylesheet">
