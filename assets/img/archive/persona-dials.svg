<svg width="780" height="420" viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Persona vectors discovery and steering - hand-drawn style</title>
  <desc id="desc">Sketchy flowchart showing how persona vectors are found and used</desc>
  
  <!-- Rough paper background -->
  <rect width="780" height="420" fill="#fffef8"/>
  <path d="M0 0 Q390 4 780 0 L780 420 Q390 416 0 420 Z" fill="#fefdfb" stroke="none"/>
  
  <!-- Hand-drawn title -->
  <text x="35" y="38" font-family="Comic Sans MS, Marker Felt, cursive" font-size="20" fill="#1e293b" transform="rotate(-0.5 35 38)">Finding the "mood sliders" inside the model</text>
  
  <!-- Step 1: Contrast pairs (wobbly box) -->
  <path d="M40 75 Q42 72 180 76 Q184 78 182 145 Q180 148 38 144 Q35 142 40 75 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="60" y="100" font-family="Comic Sans MS, cursive" font-size="13" fill="#1e40af" font-weight="bold">1. Collect pairs</text>
  <text x="52" y="120" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">"helpful" vs "snarky"</text>
  <text x="52" y="136" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">prompt examples</text>
  
  <!-- Sketchy arrow 1→2 -->
  <path d="M185 110 Q210 108 235 112 Q260 115 280 110" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M275 105 L285 110 L275 117" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Step 2: Capture activations -->
  <path d="M290 72 Q292 69 450 73 Q454 75 452 148 Q450 151 288 147 Q285 145 290 72 Z" fill="#cffafe" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <text x="310" y="98" font-family="Comic Sans MS, cursive" font-size="13" fill="#0e7490" font-weight="bold">2. Peek inside</text>
  <text x="302" y="118" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">Grab hidden states</text>
  <text x="302" y="134" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">from the model</text>
  
  <!-- Sketchy arrow 2→3 -->
  <path d="M455 110 Q485 106 510 112 Q535 118 555 108" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M550 103 L560 108 L550 115" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Step 3: Train probe -->
  <path d="M565 70 Q567 67 750 71 Q754 73 752 150 Q750 153 563 149 Q560 147 565 70 Z" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
  <text x="585" y="96" font-family="Comic Sans MS, cursive" font-size="13" fill="#4338ca" font-weight="bold">3. Find direction</text>
  <text x="577" y="116" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">Logistic regression</text>
  <text x="577" y="132" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">→ persona vector!</text>
  
  <!-- Arrow down from step 3 -->
  <path d="M658 155 Q660 180 655 205 Q652 230 658 250" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M652 245 L658 258 L665 245" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Two branches: Monitor and Steer -->
  
  <!-- Monitor box -->
  <path d="M420 265 Q422 262 580 266 Q584 268 582 348 Q580 351 418 347 Q415 345 420 265 Z" fill="#fef9c3" stroke="#eab308" stroke-width="2.5" stroke-linecap="round"/>
  <text x="445" y="292" font-family="Comic Sans MS, cursive" font-size="14" fill="#a16207" font-weight="bold">📊 Monitor</text>
  <text x="435" y="315" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">"Snark score rising..."</text>
  <text x="435" y="335" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">Alert before disaster!</text>
  
  <!-- Steer box -->
  <path d="M600 265 Q602 262 760 266 Q764 268 762 348 Q760 351 598 347 Q595 345 600 265 Z" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <text x="635" y="292" font-family="Comic Sans MS, cursive" font-size="14" fill="#15803d" font-weight="bold">🎛️ Steer</text>
  <text x="615" y="315" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">Turn down the dial</text>
  <text x="615" y="335" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">No retraining needed</text>
  
  <!-- Fun annotation with squiggly underline -->
  <text x="50" y="220" font-family="Comic Sans MS, cursive" font-size="16" fill="#1e293b" transform="rotate(-2 50 220)">The key insight:</text>
  <text x="50" y="250" font-family="Comic Sans MS, cursive" font-size="14" fill="#475569">Personality traits are</text>
  <text x="50" y="275" font-family="Comic Sans MS, cursive" font-size="14" fill="#475569" font-style="italic">directions in the model's</text>
  <text x="50" y="300" font-family="Comic Sans MS, cursive" font-size="14" fill="#475569">"thought space"</text>
  
  <!-- Little brain doodle -->
  <ellipse cx="100" cy="360" rx="35" ry="28" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M75 360 Q90 345 100 360 Q110 345 125 360" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M85 350 Q100 335 115 350" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <text x="145" y="365" font-family="Comic Sans MS, cursive" font-size="10" fill="#64748b">← the model's brain</text>
  
  <!-- Arrow showing vector direction -->
  <path d="M220 340 L280 300" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M272 298 L285 295 L280 308" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="295" y="295" font-family="Comic Sans MS, cursive" font-size="11" fill="#ef4444">"sarcasm"</text>
  <text x="295" y="310" font-family="Comic Sans MS, cursive" font-size="11" fill="#ef4444">direction</text>
</svg>
