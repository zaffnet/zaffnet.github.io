<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent workflow for building qareen - hand-drawn style</title>
  <desc id="desc">Sketchy flowchart showing planner, builders, evaluator, critic, and human review</desc>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Rough paper background -->
  <rect width="800" height="450" fill="#fffef8"/>
  
  <!-- Sketchy title -->
  <text x="35" y="35" font-family="Comic Sans MS, Marker Felt, cursive" font-size="20" fill="#1e293b" transform="rotate(-1 35 35)">How the agent squad built qareen</text>
  <text x="35" y="58" font-family="Comic Sans MS, cursive" font-size="13" fill="#64748b">(spoiler: lots of back and forth)</text>
  
  <!-- Step 1: Planner (rough cloud-ish shape) -->
  <path d="M50 100 Q55 85 90 88 Q130 82 150 95 Q170 88 185 100 Q200 95 195 120 Q205 140 190 155 Q195 175 175 180 Q160 190 130 188 Q100 192 75 180 Q50 175 48 150 Q40 125 50 100 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="85" y="125" font-family="Comic Sans MS, cursive" font-size="14" fill="#1e40af" font-weight="bold">📋 Planner</text>
  <text x="70" y="145" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">"break this into</text>
  <text x="75" y="160" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">small tasks"</text>
  
  <!-- Arrow from Planner -->
  <path d="M200 130 Q230 125 260 140 Q275 150 280 135" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M275 130 L285 135 L278 145" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M200 145 Q240 165 270 200 Q280 220 280 235" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M275 230 L280 242 L288 232" stroke="#64748b" stroke-width="2" fill="none"/>
  
  <!-- Step 2a: Builders (rough rectangle) -->
  <path d="M290 90 Q292 87 440 92 Q445 95 442 175 Q440 180 288 177 Q285 174 290 90 Z" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <text x="320" y="118" font-family="Comic Sans MS, cursive" font-size="14" fill="#15803d" font-weight="bold">🔨 Builders</text>
  <text x="305" y="140" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">Write the actual code</text>
  <text x="305" y="158" font-family="Comic Sans MS, cursive" font-size="11" fill="#475569">(sometimes it works!)</text>
  
  <!-- Step 2b: Evaluator -->
  <path d="M290 200 Q292 197 440 202 Q445 205 442 295 Q440 300 288 297 Q285 294 290 200 Z" fill="#ffedd5" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <text x="315" y="228" font-family="Comic Sans MS, cursive" font-size="14" fill="#c2410c" font-weight="bold">📊 Evaluator</text>
  <text x="305" y="250" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">Runs the metrics</text>
  <text x="305" y="268" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">"Is this actually</text>
  <text x="305" y="285" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">better?"</text>
  
  <!-- Arrow from Builders to Critic -->
  <path d="M445 135 Q480 140 505 175 Q515 195 515 210" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from Evaluator to Critic -->
  <path d="M445 250 Q480 245 505 225 Q515 210 515 210" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Critic (hexagon-ish) -->
  <path d="M520 185 Q565 170 610 185 Q625 205 625 235 Q625 265 610 280 Q565 295 520 280 Q505 260 505 235 Q505 205 520 185 Z" fill="#fef9c3" stroke="#eab308" stroke-width="2.5" stroke-linecap="round"/>
  <text x="535" y="225" font-family="Comic Sans MS, cursive" font-size="14" fill="#a16207" font-weight="bold">🔍 Critic</text>
  <text x="522" y="248" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">"Did you even</text>
  <text x="530" y="265" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">run lint?"</text>
  
  <!-- Arrow from Critic to Me -->
  <path d="M625 230 Q660 228 690 230" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Human (rough circle) -->
  <path d="M700 180 Q755 175 770 220 Q780 270 740 295 Q700 310 675 280 Q655 245 670 205 Q685 180 700 180 Z" fill="#fce7f3" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>
  <text x="695" y="225" font-family="Comic Sans MS, cursive" font-size="14" fill="#be185d" font-weight="bold">👤 Me</text>
  <text x="685" y="248" font-family="Comic Sans MS, cursive" font-size="11" fill="#1e293b">"Ship it!"</text>
  <text x="683" y="268" font-family="Comic Sans MS, cursive" font-size="11" fill="#64748b">or "nope"</text>
  
  <!-- Feedback loop (dashed, curvy) -->
  <path d="M720 300 Q730 360 600 375 Q400 390 200 375 Q100 365 90 300 Q85 250 90 195" stroke="#f97316" stroke-width="2.5" stroke-dasharray="8 5" fill="none" stroke-linecap="round"/>
  <path d="M85 200 L90 188 L98 198" stroke="#f97316" stroke-width="2" fill="none"/>
  <text x="350" y="400" font-family="Comic Sans MS, cursive" font-size="12" fill="#f97316" transform="rotate(-2 350 400)">↻ "Actually, let's try something else..."</text>
  
  
  <!-- Decorative element - coffee cup -->
  <path d="M50 380 L50 410 Q50 420 65 420 L85 420 Q100 420 100 410 L100 380 Z" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M100 390 Q115 390 115 400 Q115 410 100 410" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M55 378 Q65 370 75 378" stroke="#94a3b8" stroke-width="1"/>
  <path d="M70 375 Q80 367 90 375" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="405" font-family="Comic Sans MS, cursive" font-size="10" fill="#94a3b8">← necessary fuel</text>
</svg>
