<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LangChain RAG flow</title>
  <desc id="desc">Simple diagram showing user query flowing through retriever, prompt and LLM.</desc>
  <rect width="640" height="360" fill="#0f172a" rx="18" ry="18" />
  <g fill="#e2e8f0" font-family="'Inter','Segoe UI',sans-serif" font-size="14">
    <rect x="48" y="140" width="120" height="60" rx="12" fill="#38bdf8" />
    <text x="108" y="175" text-anchor="middle">User</text>
    <text x="108" y="195" text-anchor="middle">Question</text>
    <rect x="220" y="110" width="140" height="60" rx="12" fill="#a855f7" />
    <text x="290" y="145" text-anchor="middle">Retriever</text>
    <rect x="220" y="210" width="140" height="60" rx="12" fill="#cbd5e1" />
    <text x="290" y="245" text-anchor="middle" fill="#0f172a">Prompt</text>
    <rect x="420" y="140" width="160" height="60" rx="12" fill="#f59e0b" />
    <text x="500" y="175" text-anchor="middle">LLM Response</text>
  </g>
  <g stroke="#f8fafc" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="168" y1="170" x2="220" y2="140" />
    <line x1="168" y1="170" x2="220" y2="240" />
    <line x1="360" y1="140" x2="420" y2="170" />
    <line x1="360" y1="240" x2="420" y2="170" />
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f8fafc" />
    </marker>
  </defs>
  <text x="320" y="320" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="14" fill="#cbd5e1">Fewer lines of code, more lines of coffee saved.</text>
</svg>
