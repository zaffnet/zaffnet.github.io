<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Persona vector dashboard</title>
  <desc id="desc">Visualization of sliders for different personality traits inside a language model.</desc>
  <rect width="640" height="360" fill="#0b1120" rx="16" ry="16" />
  <text x="24" y="42" font-family="'Inter','Segoe UI',sans-serif" font-size="22" fill="#e2e8f0">LLM Mood Board™</text>
  <g transform="translate(32,90)">
    <text x="0" y="14" font-family="'Inter','Segoe UI',sans-serif" font-size="16" fill="#cbd5e1">Empathy</text>
    <rect x="120" y="0" width="360" height="16" rx="8" fill="#1e293b" />
    <rect x="120" y="0" width="240" height="16" rx="8" fill="#34d399" />
    <circle cx="360" cy="8" r="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
  </g>
  <g transform="translate(32,150)">
    <text x="0" y="14" font-family="'Inter','Segoe UI',sans-serif" font-size="16" fill="#cbd5e1">Chaos Gremlin</text>
    <rect x="120" y="0" width="360" height="16" rx="8" fill="#1e293b" />
    <rect x="120" y="0" width="80" height="16" rx="8" fill="#f97316" />
    <circle cx="200" cy="8" r="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
  </g>
  <g transform="translate(32,210)">
    <text x="0" y="14" font-family="'Inter','Segoe UI',sans-serif" font-size="16" fill="#cbd5e1">Sycophancy</text>
    <rect x="120" y="0" width="360" height="16" rx="8" fill="#1e293b" />
    <rect x="120" y="0" width="120" height="16" rx="8" fill="#60a5fa" />
    <circle cx="240" cy="8" r="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
  </g>
  <text x="320" y="320" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="14" fill="#cbd5e1">If Pixar's Inside Out had a command line, it would probably look like this.</text>
</svg>
