<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="32" fill="#0f172a"/>
  <rect x="24" y="24" width="1152" height="672" rx="28" fill="#0b1224" stroke="#1f2937" stroke-width="4"/>
  <text x="80" y="110" font-family="'Inter','Segoe UI',sans-serif" font-size="42" font-weight="700" fill="#e2e8f0">LangChain, but make it tiny</text>
  <text x="80" y="150" font-family="'Inter','Segoe UI',sans-serif" font-size="22" fill="#cbd5e1">One flow to chat, retrieve, and call tools without drowning in LOC</text>

  <rect x="120" y="220" width="200" height="120" rx="18" fill="#111827" stroke="#1f2937" stroke-width="3"/>
  <text x="150" y="270" font-family="'Inter','Segoe UI',sans-serif" font-size="22" fill="#7dd3fc">User Prompt</text>

  <rect x="420" y="200" width="240" height="160" rx="18" fill="#111827" stroke="#1f2937" stroke-width="3"/>
  <text x="450" y="255" font-family="'Inter','Segoe UI',sans-serif" font-size="22" fill="#c7d2fe">ConversationChain</text>
  <text x="450" y="285" font-family="'Inter','Segoe UI',sans-serif" font-size="16" fill="#cbd5e1">memory + LLM wrapper</text>

  <rect x="760" y="200" width="240" height="160" rx="18" fill="#111827" stroke="#1f2937" stroke-width="3"/>
  <text x="795" y="255" font-family="'Inter','Segoe UI',sans-serif" font-size="22" fill="#86efac">Tool or Retriever</text>
  <text x="795" y="285" font-family="'Inter','Segoe UI',sans-serif" font-size="16" fill="#cbd5e1">FAISS, API, DB, you name it</text>

  <rect x="420" y="420" width="240" height="140" rx="18" fill="#111827" stroke="#1f2937" stroke-width="3"/>
  <text x="450" y="480" font-family="'Inter','Segoe UI',sans-serif" font-size="22" fill="#a5b4fc">Agent layer</text>
  <text x="450" y="510" font-family="'Inter','Segoe UI',sans-serif" font-size="16" fill="#cbd5e1">Chooses next action</text>

  <rect x="760" y="420" width="240" height="140" rx="18" fill="#111827" stroke="#1f2937" stroke-width="3"/>
  <text x="795" y="480" font-family="'Inter','Segoe UI',sans-serif" font-size="22" fill="#fcd34d">Final Reply</text>
  <text x="795" y="510" font-family="'Inter','Segoe UI',sans-serif" font-size="16" fill="#cbd5e1">LLM + context + tools</text>

  <path d="M320 280 H410" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M660 280 H750" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M540 360 V420" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M660 490 H750" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
  </defs>
</svg>
