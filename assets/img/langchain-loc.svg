<svg width="760" height="380" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lines of code comparison for chatbot setup</title>
  <desc id="desc">Bar chart comparing a 29 line vanilla Python chat loop with a 12 line LangChain version plus callout for reusable pieces.</desc>
  <defs>
    <linearGradient id="gradVanilla" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gradLC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.9"/>
    </linearGradient>
    <style>
      text { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .label { font-size: 18px; font-weight: 600; }
      .caption { font-size: 14px; fill: #334155; }
      .tick { font-size: 12px; fill: #475569; }
      .note { font-size: 13px; fill: #0f172a; }
    </style>
  </defs>
  <rect width="760" height="380" fill="#f8fafc" rx="16"/>
  <text x="32" y="42" class="label">Minimal chatbot setup</text>
  <text x="32" y="68" class="caption">Vanilla loop counted at 29 lines; LangChain version at 12 lines including history.</text>

  <g transform="translate(80, 90)">
    <line x1="0" y1="0" x2="0" y2="210" stroke="#cbd5e1" stroke-width="1"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="0" y1="0" x2="520" y2="0"/>
      <line x1="0" y1="70" x2="520" y2="70"/>
      <line x1="0" y1="140" x2="520" y2="140"/>
      <line x1="0" y1="210" x2="520" y2="210"/>
    </g>
    <text x="-40" y="5" class="tick">30</text>
    <text x="-40" y="75" class="tick">20</text>
    <text x="-40" y="145" class="tick">10</text>
    <text x="-34" y="215" class="tick">0</text>

    <rect x="70" y="26" width="120" height="184" rx="10" fill="url(#gradVanilla)"/>
    <text x="130" y="18" class="label" text-anchor="middle">29 LOC</text>
    <text x="130" y="238" class="note" text-anchor="middle">Vanilla Python</text>

    <rect x="310" y="112" width="120" height="98" rx="10" fill="url(#gradLC)"/>
    <text x="370" y="104" class="label" text-anchor="middle">12 LOC</text>
    <text x="370" y="238" class="note" text-anchor="middle">LangChain</text>
  </g>

  <g transform="translate(520, 90)">
    <rect x="0" y="0" width="210" height="110" fill="#e0f2fe" rx="12" stroke="#bfdbfe" stroke-width="1.4"/>
    <text x="12" y="28" class="label">Saved lines come from:</text>
    <text x="18" y="54" class="note">• Built-in conversation memory</text>
    <text x="18" y="74" class="note">• Prompt templating</text>
    <text x="18" y="94" class="note">• Ready-made RetrievalQA chain</text>
  </g>
</svg>
