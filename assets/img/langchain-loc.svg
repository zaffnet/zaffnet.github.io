<svg width="640" height="360" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">Lines of code for a basic chat loop</title>
  <desc id="desc">Comparison of line counts: plain OpenAI loop at 29 lines versus LangChain ConversationChain at 12 lines, measured with wc -l.</desc>
  <rect width="640" height="360" fill="#0b1021"/>
  <text x="320" y="36" text-anchor="middle" font-family="'Inter', Arial" font-size="20" fill="#e2e8f0">Lean chatbots with LangChain</text>
  <text x="320" y="60" text-anchor="middle" font-family="'Inter', Arial" font-size="13" fill="#cbd5f5">Line counts measured from working scripts</text>
  <g transform="translate(80,90)">
    <rect x="40" y="70" width="120" height="150" fill="#f472b6" rx="12"/>
    <text x="100" y="240" text-anchor="middle" font-family="'Inter', Arial" font-size="14" fill="#e2e8f0">Plain OpenAI loop</text>
    <text x="100" y="65" text-anchor="middle" font-family="'Inter', Arial" font-size="13" fill="#e2e8f0">29 lines</text>
    <rect x="260" y="130" width="120" height="90" fill="#22d3ee" rx="12"/>
    <text x="320" y="240" text-anchor="middle" font-family="'Inter', Arial" font-size="14" fill="#e2e8f0">LangChain ConversationChain</text>
    <text x="320" y="125" text-anchor="middle" font-family="'Inter', Arial" font-size="13" fill="#e2e8f0">12 lines</text>
  </g>
  <g fill="#a5b4fc" font-family="'Inter', Arial" font-size="12">
    <text x="110" y="300">Counts taken with wc -l on runnable samples.</text>
    <text x="110" y="320">Both scripts keep turn-by-turn chat history.</text>
  </g>
</svg>
