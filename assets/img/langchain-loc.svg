<svg width="700" height="340" viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lines of code comparison - hand-drawn style</title>
  <desc id="desc">Sketchy bar chart comparing vanilla Python (29 lines) vs LangChain (12 lines)</desc>
  
  <!-- Rough paper background -->
  <rect width="700" height="340" fill="#fffef8"/>
  <path d="M0 0 Q350 3 700 0 L700 340 Q350 337 0 340 Z" fill="#fefdfb" stroke="none"/>
  
  <!-- Hand-drawn style definitions -->
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="sketchy-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 Q2 4 0 8 L8 4 Z" fill="#d97706"/>
    </marker>
  </defs>
  
  <!-- Sketchy title -->
  <text x="40" y="40" font-family="Comic Sans MS, Marker Felt, cursive" font-size="22" fill="#1e293b" transform="rotate(-1 40 40)">Before &amp; After: Chatbot Code</text>
  
  <!-- Wobbly axis lines -->
  <path d="M80 260 Q82 130 80 80" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#pencil)"/>
  <path d="M80 258 Q300 262 520 258" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#pencil)"/>
  
  <!-- Y-axis labels (hand-written style) -->
  <text x="70" y="88" font-family="Comic Sans MS, cursive" font-size="14" fill="#475569" text-anchor="end">30</text>
  <text x="70" y="148" font-family="Comic Sans MS, cursive" font-size="14" fill="#475569" text-anchor="end">20</text>
  <text x="70" y="208" font-family="Comic Sans MS, cursive" font-size="14" fill="#475569" text-anchor="end">10</text>
  <text x="70" y="260" font-family="Comic Sans MS, cursive" font-size="14" fill="#475569" text-anchor="end">0</text>
  
  <!-- Vanilla Python bar (rough rectangle) -->
  <path d="M130 258 L128 92 Q180 88 232 92 L234 258 Q180 260 130 258 Z" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="76" font-family="Comic Sans MS, cursive" font-size="18" fill="#c2410c" text-anchor="middle" font-weight="bold">29</text>
  <text x="180" y="280" font-family="Comic Sans MS, cursive" font-size="14" fill="#1e293b" text-anchor="middle">Vanilla</text>
  <text x="180" y="298" font-family="Comic Sans MS, cursive" font-size="14" fill="#1e293b" text-anchor="middle">Python</text>
  
  <!-- LangChain bar (rough rectangle) -->
  <path d="M320 258 L318 178 Q370 174 422 178 L424 258 Q370 260 320 258 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="370" y="162" font-family="Comic Sans MS, cursive" font-size="18" fill="#1d4ed8" text-anchor="middle" font-weight="bold">12</text>
  <text x="370" y="280" font-family="Comic Sans MS, cursive" font-size="14" fill="#1e293b" text-anchor="middle">LangChain</text>
  
  <!-- Hand-drawn annotation box -->
  <path d="M490 75 Q492 73 635 77 Q637 79 633 175 Q631 177 488 173 Q486 171 490 75 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <text x="500" y="100" font-family="Comic Sans MS, cursive" font-size="13" fill="#1e293b">Where'd 17 lines go?</text>
  <text x="500" y="122" font-family="Comic Sans MS, cursive" font-size="12" fill="#475569">• Memory handling</text>
  <text x="500" y="142" font-family="Comic Sans MS, cursive" font-size="12" fill="#475569">• Prompt templates</text>
  <text x="500" y="162" font-family="Comic Sans MS, cursive" font-size="12" fill="#475569">• Retry logic</text>
  
  <!-- Sketchy arrow pointing to the savings -->
  <path d="M460 125 Q475 130 485 125" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#sketchy-arrow)" stroke-linecap="round"/>
  
  <!-- Fun annotation -->
  <text x="550" y="220" font-family="Comic Sans MS, cursive" font-size="11" fill="#64748b" transform="rotate(-3 550 220)">^ less code,</text>
  <text x="545" y="238" font-family="Comic Sans MS, cursive" font-size="11" fill="#64748b" transform="rotate(-2 545 238)">fewer bugs 🎉</text>
</svg>
