<svg width="620" height="360" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
<title id="title">LangChain LOC comparison</title>
<desc id="desc">Bar chart comparing a vanilla Python chatbot and a LangChain RAG chatbot.</desc>
<rect width="620" height="360" fill="#f8fafc"/>
<text x="310" y="32" text-anchor="middle" font-family="Inter,Arial" font-size="20" fill="#0f172a">RAG chatbot LOC (toy example)</text>
<g transform="translate(120,70)" font-family="Inter,Arial">
  <rect x="40" y="80" width="120" height="170" fill="#ef4444" rx="6"/>
  <text x="100" y="265" text-anchor="middle" font-size="15" fill="#0f172a">Vanilla Python</text>
  <text x="100" y="75" text-anchor="middle" font-size="14" fill="#0f172a">420 LOC</text>
  <rect x="260" y="140" width="120" height="110" fill="#3b82f6" rx="6"/>
  <text x="320" y="265" text-anchor="middle" font-size="15" fill="#0f172a">LangChain</text>
  <text x="320" y="135" text-anchor="middle" font-size="14" fill="#0f172a">160 LOC</text>
  <text x="190" y="300" font-size="13" fill="#475569">Less boilerplate, more naps.</text>
</g>
</svg>
