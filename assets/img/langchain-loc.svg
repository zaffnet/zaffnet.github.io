<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Chat loop LOC: plain Python vs LangChain</title>
  <desc id="desc">Bar chart comparing 29 lines for a plain Python chat loop versus 12 lines for a LangChain ConversationChain version.</desc>
  <defs>
    <linearGradient id="gradPython" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#9fd3ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gradLC" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f9d29d"/>
      <stop offset="100%" stop-color="#f28e2b"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="#f8fafc" rx="12"/>
  <g transform="translate(90,40)">
    <text x="0" y="0" fill="#0f172a" font-family="'Inter', 'Helvetica', 'Arial', sans-serif" font-size="20" font-weight="600">Chat loop LOC: plain Python vs LangChain</text>
    <g transform="translate(0,30)" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4">
      <line x1="0" x2="560" y1="260" y2="260"/>
      <line x1="0" x2="560" y1="190" y2="190"/>
      <line x1="0" x2="560" y1="120" y2="120"/>
      <line x1="0" x2="560" y1="50" y2="50"/>
    </g>
    <g transform="translate(120,70)">
      <rect x="0" y="0" width="120" height="232" rx="12" fill="url(#gradPython)"/>
      <text x="60" y="-12" text-anchor="middle" fill="#0f172a" font-family="'Inter', sans-serif" font-size="16" font-weight="600">29 lines</text>
      <text x="60" y="260" text-anchor="middle" fill="#1f2937" font-family="'Inter', sans-serif" font-size="14">Plain Python loop</text>
    </g>
    <g transform="translate(360,70)">
      <rect x="0" y="116" width="120" height="116" rx="12" fill="url(#gradLC)"/>
      <text x="60" y="100" text-anchor="middle" fill="#0f172a" font-family="'Inter', sans-serif" font-size="16" font-weight="600">12 lines</text>
      <text x="60" y="260" text-anchor="middle" fill="#1f2937" font-family="'Inter', sans-serif" font-size="14">LangChain chain</text>
    </g>
    <text x="0" y="310" fill="#475569" font-family="'Inter', 'Helvetica', 'Arial', sans-serif" font-size="13">Baseline was a 29-line loop that kept chat history manually. LangChain's ConversationChain handled memory in 12 lines.</text>
  </g>
</svg>
