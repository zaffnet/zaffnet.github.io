<svg width="720" height="380" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">LangChain stack for the LOC comparison</title>
  <desc id="desc">Component diagram of the 12-line LangChain script: ChatOpenAI, ConversationBufferMemory, ConversationChain, and RetrievalQA swap.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#cbd5f5"/>
    </marker>
  </defs>
  <rect width="720" height="380" rx="14" fill="#0b1021"/>
  <text x="360" y="32" text-anchor="middle" font-family="'Inter', Arial" font-size="20" fill="#e2e8f0">Pieces behind the 12-line LangChain sample</text>
  <text x="360" y="54" text-anchor="middle" font-family="'Inter', Arial" font-size="13" fill="#cbd5e1">Exact components used to beat the 29-line plain loop.</text>

  <g font-family="'Inter', Arial" font-size="13" fill="#e2e8f0" transform="translate(60,90)">
    <rect x="0" y="0" width="160" height="120" rx="12" fill="#1f2937"/>
    <text x="80" y="26" text-anchor="middle" font-size="15">ChatOpenAI</text>
    <text x="80" y="52" text-anchor="middle">gpt-4o-mini</text>
    <text x="80" y="72" text-anchor="middle">temperature 0.2</text>
  </g>

  <g font-family="'Inter', Arial" font-size="13" fill="#0b1224" transform="translate(260,80)">
    <rect x="0" y="0" width="180" height="140" rx="12" fill="#22d3ee" opacity="0.92"/>
    <text x="90" y="26" text-anchor="middle" font-size="15">ConversationBufferMemory</text>
    <text x="90" y="52" text-anchor="middle">stores turn history</text>
    <text x="90" y="72" text-anchor="middle">feeds ConversationChain</text>
  </g>

  <g font-family="'Inter', Arial" font-size="13" fill="#e2e8f0" transform="translate(500,80)">
    <rect x="0" y="0" width="160" height="140" rx="12" fill="#7c3aed" opacity="0.9"/>
    <text x="80" y="26" text-anchor="middle" font-size="15">ConversationChain</text>
    <text x="80" y="52" text-anchor="middle">predict(input=...)</text>
    <text x="80" y="72" text-anchor="middle">wraps LLM + memory</text>
  </g>

  <g font-family="'Inter', Arial" font-size="13" fill="#e2e8f0" transform="translate(200,250)">
    <rect x="0" y="0" width="320" height="100" rx="14" fill="#1e293b"/>
    <text x="160" y="26" text-anchor="middle" font-size="15">RetrievalQA swap</text>
    <text x="160" y="50" text-anchor="middle">same LLM plugged into a retriever</text>
    <text x="160" y="70" text-anchor="middle">prompt template wraps context</text>
  </g>

  <g stroke="#cbd5f5" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity="0.85">
    <path d="M220 150 L260 150"/>
    <path d="M440 150 L500 150"/>
    <path d="M360 220 L360 250"/>
  </g>
  <g font-family="'Inter', Arial" font-size="12" fill="#a5b4fc">
    <text x="360" y="362" text-anchor="middle">Shared pieces kept the code short while letting retrieval drop in without rewrites.</text>
  </g>
</svg>
