<svg width="760" height="420" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">LangChain pieces for a lean chatbot</title>
  <desc id="desc">Diagram of a ConversationChain with OpenAI model, prompt template, and buffer memory.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#cbd5e1"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="760" height="420" fill="url(#bg)"/>
  <text x="380" y="32" text-anchor="middle" font-family="'Inter', Arial" font-size="20" fill="#e2e8f0">ConversationChain wiring</text>
  <text x="380" y="52" text-anchor="middle" font-family="'Inter', Arial" font-size="13" fill="#94a3b8">Matches the 12-line snippet in the post</text>

  <g transform="translate(80,110)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="180" height="160" rx="16" fill="#1e293b"/>
    <text x="90" y="26" text-anchor="middle" font-size="14">Prompt template</text>
    <text x="90" y="52" text-anchor="middle">formats user turns</text>
    <text x="90" y="72" text-anchor="middle">adds system message</text>
    <text x="90" y="92" text-anchor="middle">handles retries</text>
  </g>

  <g transform="translate(300,90)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="180" height="200" rx="16" fill="#22d3ee" opacity="0.9"/>
    <text x="90" y="26" text-anchor="middle" font-size="14">ChatOpenAI</text>
    <text x="90" y="52" text-anchor="middle">model = gpt-4o-mini</text>
    <text x="90" y="72" text-anchor="middle">temperature = 0.2</text>
    <text x="90" y="92" text-anchor="middle">stream + logprobs ready</text>
  </g>

  <g transform="translate(520,110)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="180" height="160" rx="16" fill="#22c55e" opacity="0.9"/>
    <text x="90" y="26" text-anchor="middle" font-size="14">ConversationBufferMemory</text>
    <text x="90" y="52" text-anchor="middle">stores turn history</text>
    <text x="90" y="72" text-anchor="middle">truncates by tokens</text>
    <text x="90" y="92" text-anchor="middle">drop-in for other memories</text>
  </g>

  <g stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity="0.85">
    <path d="M260 190 L300 190"/>
    <path d="M480 190 L520 190"/>
  </g>

  <g fill="#cbd5e1" font-family="'Inter', Arial" font-size="12">
    <text x="380" y="360" text-anchor="middle">Result: 12 lines to wire prompt + model + buffer, versus 29 for a manual loop.</text>
  </g>
</svg>
