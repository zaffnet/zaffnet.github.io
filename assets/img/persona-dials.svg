<svg width="860" height="420" viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How persona vectors are discovered and applied</title>
  <desc id="desc">Pipeline showing data collection, activation capture, linear probe training, persona vector export, monitoring, and steering.</desc>
  <style>
    text { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #0f172a; }
    .label { font-size: 16px; font-weight: 700; }
    .body { font-size: 13px; fill: #1f2937; }
    .step { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 1.3; }
    .arrow { stroke: #94a3b8; stroke-width: 1.6; marker-end: url(#arrowhead); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="860" height="420" rx="18" fill="#f8fafc"/>
  <text x="26" y="38" class="label">Persona vectors in practice</text>
  <text x="26" y="60" class="body">Outline based on Anthropic's paper: probes on hidden states find steerable directions without retraining.</text>

  <g transform="translate(40, 96)">
    <rect class="step" x="0" y="0" width="190" height="90" rx="14" fill="#e0f2fe" stroke="#bfdbfe"/>
    <text x="16" y="30" class="label">Collect contrast pairs</text>
    <text x="16" y="52" class="body">Prompts with and without target trait</text>
    <text x="16" y="72" class="body">(e.g., helpful vs. sarcastic)</text>
  </g>

  <g transform="translate(280, 96)">
    <rect class="step" x="0" y="0" width="200" height="90" rx="14" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="16" y="30" class="label">Capture activations</text>
    <text x="16" y="52" class="body">Grab hidden states around the</text>
    <text x="16" y="72" class="body">final token or residual stream</text>
  </g>

  <g transform="translate(520, 96)">
    <rect class="step" x="0" y="0" width="260" height="90" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="16" y="30" class="label">Train linear probes</text>
    <text x="16" y="52" class="body">Logistic regression separates activations</text>
    <text x="16" y="72" class="body">by trait; weights become persona vectors</text>
  </g>

  <line class="arrow" x1="230" y1="141" x2="280" y2="141"/>
  <line class="arrow" x1="480" y1="141" x2="520" y2="141"/>

  <g transform="translate(160, 224)">
    <rect class="step" x="0" y="0" width="230" height="110" rx="14" fill="#ecfdf3" stroke="#bbf7d0"/>
    <text x="16" y="30" class="label">Export persona vectors</text>
    <text x="16" y="52" class="body">Store directions per layer</text>
    <text x="16" y="72" class="body">with strength bounds</text>
  </g>

  <line class="arrow" x1="275" y1="186" x2="275" y2="224"/>

  <g transform="translate(460, 224)">
    <rect class="step" x="0" y="0" width="180" height="110" rx="14" fill="#fef9c3" stroke="#fcd34d"/>
    <text x="16" y="30" class="label">Monitor</text>
    <text x="16" y="52" class="body">Log activations during chat</text>
    <text x="16" y="72" class="body">Alert when a vector spikes</text>
  </g>

  <g transform="translate(680, 224)">
    <rect class="step" x="0" y="0" width="140" height="110" rx="14" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="12" y="30" class="label">Steer</text>
    <text x="12" y="52" class="body">Add or subtract vector</text>
    <text x="12" y="72" class="body">during inference</text>
  </g>

  <line class="arrow" x1="390" y1="279" x2="460" y2="279"/>
  <line class="arrow" x1="640" y1="279" x2="680" y2="279"/>
</svg>
