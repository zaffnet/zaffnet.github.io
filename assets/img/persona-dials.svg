<svg width="620" height="300" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
<title id="title">Persona activation dials</title>
<desc id="desc">Horizontal bars showing activations for different persona traits.</desc>
<rect width="620" height="300" fill="#f9fafb"/>
<text x="310" y="32" text-anchor="middle" font-family="Inter,Arial" font-size="20" fill="#0f172a">Persona activation dials</text>
<g transform="translate(120,70)" font-family="Inter,Arial">
  <text x="0" y="20" font-size="14" fill="#0f172a">Helpful</text>
  <rect x="90" y="5" width="320" height="18" fill="#10b981" rx="4"/>
  <text x="420" y="20" font-size="13" fill="#0f172a">0.80</text>
  <text x="0" y="65" font-size="14" fill="#0f172a">Sassy</text>
  <rect x="90" y="50" width="140" height="18" fill="#22c55e" rx="4"/>
  <text x="240" y="65" font-size="13" fill="#0f172a">0.35</text>
  <text x="0" y="110" font-size="14" fill="#0f172a">Hallucinatory</text>
  <rect x="90" y="95" width="60" height="18" fill="#a3e635" rx="4"/>
  <text x="170" y="110" font-size="13" fill="#0f172a">0.15</text>
  <text x="0" y="155" font-size="14" fill="#0f172a">Sycophantic</text>
  <rect x="90" y="140" width="100" height="18" fill="#eab308" rx="4"/>
  <text x="210" y="155" font-size="13" fill="#0f172a">0.25</text>
</g>
</svg>
