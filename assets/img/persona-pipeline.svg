<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Persona vector pipeline</title>
  <desc id="desc">High level steps from Anthropic's persona vector research: paired prompts, activation capture, linear probe, dimensionality check, persona vector, and monitoring or steering.</desc>
  <rect width="960" height="260" rx="16" fill="#f8fafc"/>
  <g font-family="'Inter','Helvetica','Arial',sans-serif" fill="#0f172a" font-size="18" font-weight="600" transform="translate(24,28)">
    <text x="0" y="0">Persona vector pipeline (per Anthropic's report)</text>
  </g>
  <g font-family="'Inter','Helvetica','Arial',sans-serif" font-size="14" fill="#0f172a" transform="translate(40,70)">
    <rect x="0" y="0" width="150" height="120" rx="12" fill="#ecfeff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="75" y="36" text-anchor="middle" font-weight="600">Prompt pairs</text>
    <text x="75" y="60" text-anchor="middle">trait vs neutral</text>
  </g>
  <g font-family="'Inter','Helvetica','Arial',sans-serif" font-size="14" fill="#0f172a" transform="translate(210,70)">
    <rect x="0" y="0" width="170" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="85" y="36" text-anchor="middle" font-weight="600">Hidden activations</text>
    <text x="85" y="60" text-anchor="middle">captured per prompt</text>
  </g>
  <g font-family="'Inter','Helvetica','Arial',sans-serif" font-size="14" fill="#0f172a" transform="translate(410,70)">
    <rect x="0" y="0" width="160" height="120" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="80" y="36" text-anchor="middle" font-weight="600">Linear probe</text>
    <text x="80" y="60" text-anchor="middle">find contrast direction</text>
  </g>
  <g font-family="'Inter','Helvetica','Arial',sans-serif" font-size="14" fill="#0f172a" transform="translate(600,70)">
    <rect x="0" y="0" width="140" height="120" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="70" y="36" text-anchor="middle" font-weight="600">Stability check</text>
    <text x="70" y="60" text-anchor="middle">PCA / norms</text>
  </g>
  <g font-family="'Inter','Helvetica','Arial',sans-serif" font-size="14" fill="#0f172a" transform="translate(770,70)">
    <rect x="0" y="0" width="150" height="120" rx="12" fill="#ecfccb" stroke="#84cc16" stroke-width="2"/>
    <text x="75" y="36" text-anchor="middle" font-weight="600">Persona vector</text>
    <text x="75" y="60" text-anchor="middle">monitor or steer</text>
  </g>
  <g stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="130" x2="210" y2="130"/>
    <line x1="380" y1="130" x2="410" y2="130"/>
    <line x1="570" y1="130" x2="600" y2="130"/>
    <line x1="740" y1="130" x2="770" y2="130"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>
