<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" fill="none">
  <style>
    .title { font: 20px 'Helvetica', sans-serif; font-weight: bold; fill: #0f172a; }
    .label { font: 14px 'Helvetica', sans-serif; fill: #111827; }
    .note { font: 12px 'Helvetica', sans-serif; fill: #374151; }
    .box { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 10; ry: 10; }
    .arrow { stroke: #0f172a; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="16" ry="16" />
  <text x="32" y="42" class="title">Agentic patterns that kept qareen on track</text>
  <rect class="box" x="40" y="70" width="160" height="80" />
  <text x="50" y="100" class="label">Planner</text>
  <text x="50" y="120" class="note">Breaks work into tickets</text>
  <text x="50" y="138" class="note">Feeds builders scoped briefs</text>

  <rect class="box" x="260" y="70" width="160" height="80" />
  <text x="270" y="100" class="label">Builders</text>
  <text x="270" y="120" class="note">Implement tasks</text>
  <text x="270" y="138" class="note">Return diffs and notes</text>

  <rect class="box" x="480" y="70" width="180" height="80" />
  <text x="490" y="100" class="label">Critic</text>
  <text x="490" y="120" class="note">Lint, sanity checks</text>
  <text x="490" y="138" class="note">Flags regressions early</text>

  <rect class="box" x="140" y="200" width="180" height="80" />
  <text x="150" y="230" class="label">Tool router</text>
  <text x="150" y="250" class="note">Chooses eval, UI, or data path</text>

  <rect class="box" x="380" y="200" width="220" height="80" />
  <text x="390" y="230" class="label">Replay log</text>
  <text x="390" y="250" class="note">Stores commands + outputs</text>
  <text x="390" y="268" class="note">Makes reruns reproducible</text>

  <rect class="box" x="260" y="320" width="200" height="70" fill="#dcfce7" stroke="#16a34a" />
  <text x="270" y="350" class="label">Human review</text>
  <text x="270" y="370" class="note">Final call on tradeoffs</text>

  <line class="arrow" x1="200" y1="110" x2="260" y2="110" />
  <line class="arrow" x1="420" y1="110" x2="480" y2="110" />
  <line class="arrow" x1="540" y1="150" x2="540" y2="200" />
  <line class="arrow" x1="220" y1="150" x2="220" y2="200" />
  <line class="arrow" x1="320" y1="150" x2="320" y2="320" />
  <line class="arrow" x1="480" y1="240" x2="380" y2="240" />
  <line class="arrow" x1="360" y1="240" x2="260" y2="240" />
  <line class="arrow" x1="360" y1="365" x2="280" y2="365" />
  <line class="arrow" x1="460" y1="365" x2="520" y2="365" marker-end="url(#arrowhead)" />
</svg>
