<svg width="760" height="420" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">Agent design patterns used in qareen</title>
  <desc id="desc">Flow showing planner, routing, builders, critic, replay log, and human review steps applied while developing qareen.</desc>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#cbd5f5"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#0b1224"/>
  <text x="380" y="32" text-anchor="middle" font-family="'Inter', Arial" font-size="20" fill="#e2e8f0">Patterns that stuck</text>
  <text x="380" y="52" text-anchor="middle" font-family="'Inter', Arial" font-size="13" fill="#94a3b8">Documented from qareen's agent sessions</text>

  <g transform="translate(60,90)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="150" height="80" fill="url(#grad)" rx="12"/>
    <text x="75" y="26" text-anchor="middle" font-size="14">Planner</text>
    <text x="75" y="50" text-anchor="middle">Tickets + acceptance</text>
  </g>

  <g transform="translate(230,90)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="150" height="80" fill="#0ea5e9" rx="12" opacity="0.85"/>
    <text x="75" y="26" text-anchor="middle" font-size="14">Tool router</text>
    <text x="75" y="50" text-anchor="middle">retriever vs UI tasks</text>
  </g>

  <g transform="translate(400,90)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="150" height="80" fill="#22c55e" rx="12" opacity="0.85"/>
    <text x="75" y="26" text-anchor="middle" font-size="14">Builders</text>
    <text x="75" y="50" text-anchor="middle">implement + docs</text>
  </g>

  <g transform="translate(570,90)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="150" height="80" fill="#7c3aed" rx="12" opacity="0.9"/>
    <text x="75" y="26" text-anchor="middle" font-size="14">Critic</text>
    <text x="75" y="50" text-anchor="middle">lint + sanity checks</text>
  </g>

  <g transform="translate(150,230)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="190" height="90" fill="#111827" rx="12"/>
    <text x="95" y="26" text-anchor="middle" font-size="14">Replay log</text>
    <text x="95" y="50" text-anchor="middle">commands + outputs</text>
    <text x="95" y="70" text-anchor="middle">kept for audit + rollback</text>
  </g>

  <g transform="translate(390,230)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="220" height="90" fill="#f97316" rx="12" opacity="0.9"/>
    <text x="110" y="26" text-anchor="middle" font-size="14">Human review</text>
    <text x="110" y="50" text-anchor="middle">merge only after eyeballing</text>
    <text x="110" y="70" text-anchor="middle">keeps reranker sane</text>
  </g>

  <g stroke="#cbd5f5" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity="0.85">
    <path d="M210 130 L230 130"/>
    <path d="M380 130 L400 130"/>
    <path d="M550 130 L570 130"/>
    <path d="M305 170 Q305 200 245 200 Q185 200 185 230"/>
    <path d="M475 170 Q475 200 520 200 Q565 200 565 230"/>
    <path d="M340 275 L390 275"/>
  </g>

  <g fill="#cbd5e1" font-family="'Inter', Arial" font-size="12">
    <text x="380" y="360" text-anchor="middle">Loop: plan → route → build → critique → replay if needed → human merge.</text>
  </g>
</svg>
