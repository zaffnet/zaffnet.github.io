<svg width="600" height="360" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
<title id="title">qareen agent effort chart</title>
<desc id="desc">Bar chart showing how different agents saved development hours.</desc>
<rect width="600" height="360" fill="#f8fafc"/>
<text x="300" y="35" text-anchor="middle" font-family="Inter,Arial" font-size="20" fill="#0f172a">Who did the heavy lifting?</text>
<g transform="translate(80,70)" fill="#0f172a" font-family="Inter,Arial" font-size="14">
  <rect x="30" y="70" width="80" height="140" fill="#4f46e5" rx="6"/>
  <text x="70" y="225" text-anchor="middle">Retriever</text>
  <text x="70" y="65" text-anchor="middle" font-size="13">3.5h</text>
  <rect x="170" y="110" width="80" height="100" fill="#22d3ee" rx="6"/>
  <text x="210" y="225" text-anchor="middle">Reranker</text>
  <text x="210" y="105" text-anchor="middle" font-size="13">2.5h</text>
  <rect x="310" y="150" width="80" height="60" fill="#a855f7" rx="6"/>
  <text x="350" y="225" text-anchor="middle">Judge</text>
  <text x="350" y="145" text-anchor="middle" font-size="13">1.5h</text>
  <rect x="450" y="170" width="80" height="40" fill="#f97316" rx="6"/>
  <text x="490" y="225" text-anchor="middle">UI helper</text>
  <text x="490" y="165" text-anchor="middle" font-size="13">1h</text>
</g>
</svg>
