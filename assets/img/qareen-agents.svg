<svg width="920" height="520" viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How agents collaborated while building qareen</title>
  <desc id="desc">Diagram showing the workflow: planner creates tickets, builders and evaluator work in parallel, critic checks code, then human reviews and loops back.</desc>
  <style>
    text { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #0f172a; }
    .title { font-size: 20px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 700; }
    .body { font-size: 12px; fill: #334155; }
    .icon { font-size: 24px; }
    .step-num { font-size: 11px; font-weight: 700; fill: #fff; }
    .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .arrow-label { font-size: 11px; fill: #64748b; font-weight: 500; }
    .feedback-arrow { stroke: #f97316; stroke-width: 2; stroke-dasharray: 6 3; marker-end: url(#arrowhead-orange); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrowhead-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="920" height="520" rx="18" fill="#f8fafc"/>

  <!-- Header -->
  <text x="32" y="38" class="title">How the agent swarm built qareen</text>
  <text x="32" y="60" class="subtitle">Work flows left to right: plan → build → check → review → ship (or loop back)</text>

  <!-- Step 1: Planner -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="180" height="140" rx="14" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="20" cy="20" r="12" fill="#0ea5e9"/>
    <text x="20" y="20" class="step-num" text-anchor="middle" dominant-baseline="middle">1</text>
    <text x="40" y="26" class="icon">📋</text>
    <text x="66" y="26" class="label">Planner</text>
    <text x="14" y="54" class="body">Breaks work into tickets</text>
    <text x="14" y="72" class="body">Assigns tasks to agents</text>
    <text x="14" y="90" class="body">Sets acceptance criteria</text>
    <line x1="14" y1="104" x2="166" y2="104" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3"/>
    <text x="14" y="122" class="body" fill="#0369a1">Output: task queue</text>
  </g>

  <!-- Arrow: Planner to Builders (top path) -->
  <path class="arrow" d="M 220 150 L 245 150 L 245 140 L 270 140"/>
  <!-- Arrow: Planner to Evaluator (bottom path) -->
  <path class="arrow" d="M 220 190 L 245 190 L 245 280 L 270 280"/>
  <text x="225" y="128" class="arrow-label">tasks</text>

  <!-- Step 2a: Builders -->
  <g transform="translate(270, 90)">
    <rect x="0" y="0" width="200" height="120" rx="14" fill="#ecfdf3" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="20" cy="20" r="12" fill="#22c55e"/>
    <text x="20" y="20" class="step-num" text-anchor="middle" dominant-baseline="middle">2a</text>
    <text x="40" y="26" class="icon">🔨</text>
    <text x="68" y="26" class="label">Builders</text>
    <text x="14" y="54" class="body">Write reranker logic</text>
    <text x="14" y="72" class="body">Add UI weight sliders</text>
    <line x1="14" y1="86" x2="186" y2="86" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
    <text x="14" y="104" class="body" fill="#15803d">Output: code diffs</text>
  </g>

  <!-- Step 2b: Evaluator -->
  <g transform="translate(270, 230)">
    <rect x="0" y="0" width="200" height="140" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="20" cy="20" r="12" fill="#f97316"/>
    <text x="20" y="20" class="step-num" text-anchor="middle" dominant-baseline="middle">2b</text>
    <text x="40" y="26" class="icon">📊</text>
    <text x="68" y="26" class="label">Evaluator</text>
    <text x="14" y="54" class="body">Compares MRR vs RRF</text>
    <text x="14" y="72" class="body">Scores example quality</text>
    <text x="14" y="90" class="body">Logs runs for replay</text>
    <line x1="14" y1="104" x2="186" y2="104" stroke="#f97316" stroke-width="1" stroke-opacity="0.3"/>
    <text x="14" y="122" class="body" fill="#c2410c">Output: metrics</text>
  </g>

  <!-- Arrow: Builders to Critic -->
  <path class="arrow" d="M 470 150 L 495 150 L 495 200 L 520 200"/>
  <!-- Arrow: Evaluator to Critic -->
  <path class="arrow" d="M 470 300 L 495 300 L 495 240 L 520 240"/>
  <text x="475" y="173" class="arrow-label">diffs</text>
  <text x="475" y="273" class="arrow-label">results</text>

  <!-- Step 3: Critic -->
  <g transform="translate(520, 160)">
    <rect x="0" y="0" width="180" height="120" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="20" cy="20" r="12" fill="#eab308"/>
    <text x="20" y="20" class="step-num" text-anchor="middle" dominant-baseline="middle">3</text>
    <text x="40" y="26" class="icon">🔍</text>
    <text x="66" y="26" class="label">Critic</text>
    <text x="14" y="54" class="body">Runs linting + tests</text>
    <text x="14" y="72" class="body">Catches missing imports</text>
    <line x1="14" y1="86" x2="166" y2="86" stroke="#eab308" stroke-width="1" stroke-opacity="0.3"/>
    <text x="14" y="104" class="body" fill="#a16207">Output: pass/fail</text>
  </g>

  <!-- Arrow: Critic to Human -->
  <path class="arrow" d="M 700 220 L 760 220"/>
  <text x="708" y="208" class="arrow-label">approved</text>

  <!-- Step 4: Human review -->
  <g transform="translate(760, 140)">
    <rect x="0" y="0" width="140" height="160" rx="14" fill="#fce7f3" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="20" cy="20" r="12" fill="#ec4899"/>
    <text x="20" y="20" class="step-num" text-anchor="middle" dominant-baseline="middle">4</text>
    <text x="40" y="26" class="icon">👤</text>
    <text x="66" y="26" class="label">Human</text>
    <text x="14" y="54" class="body">Reviews PRs</text>
    <text x="14" y="72" class="body">Tunes weights</text>
    <text x="14" y="90" class="body">Ships releases</text>
    <line x1="14" y1="104" x2="126" y2="104" stroke="#ec4899" stroke-width="1" stroke-opacity="0.3"/>
    <text x="14" y="122" class="body" fill="#be185d">✓ Approve or</text>
    <text x="14" y="140" class="body" fill="#be185d">↩ Request changes</text>
  </g>

  <!-- Feedback loop arrow -->
  <path class="feedback-arrow" d="M 830 300 L 830 410 L 130 410 L 130 240"/>
  <text x="420" y="430" class="arrow-label" fill="#f97316">Feedback loop: new tickets or revision requests</text>

  <!-- Legend -->
  <g transform="translate(40, 465)">
    <rect x="0" y="0" width="840" height="40" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="16" y="26" class="body" font-weight="600">Key:</text>
    <line x1="60" y1="20" x2="95" y2="20" class="arrow"/>
    <text x="105" y="25" class="body">Forward flow</text>
    <line x1="200" y1="20" x2="235" y2="20" class="feedback-arrow"/>
    <text x="245" y="25" class="body">Feedback loop</text>
    <circle cx="360" cy="20" r="8" fill="#0ea5e9"/>
    <text x="376" y="25" class="body">Step number</text>
    <text x="480" y="26" class="icon" style="font-size:16px">📋🔨📊🔍👤</text>
    <text x="590" y="25" class="body">Agent roles</text>
  </g>
</svg>
