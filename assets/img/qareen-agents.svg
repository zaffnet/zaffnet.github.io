<svg width="920" height="480" viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How agents collaborated while building qareen</title>
  <desc id="desc">Diagram of planner, builders, critic, evaluator, and UI passes used to ship qareen features.</desc>
  <style>
    text { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #0f172a; }
    .label { font-size: 16px; font-weight: 700; }
    .body { font-size: 13px; fill: #1f2937; }
    .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; }
    .arrow { stroke: #94a3b8; stroke-width: 1.6; marker-end: url(#arrowhead); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="920" height="480" rx="18" fill="#f1f5f9"/>
  <text x="26" y="40" class="label">Agent collaboration map</text>
  <text x="26" y="62" class="body">Actual loop used while shipping qareen: planner tickets, builders commit diffs, critic runs tests, human reviews.</text>

  <g transform="translate(60, 110)">
    <rect class="box" x="0" y="0" width="200" height="110" rx="14" fill="#e0f2fe" stroke="#bfdbfe"/>
    <text x="16" y="30" class="label">Planner</text>
    <text x="16" y="52" class="body">Breaks work into tickets</text>
    <text x="16" y="72" class="body">Maps tasks to tools</text>
    <text x="16" y="92" class="body">Writes acceptance checks</text>
  </g>

  <g transform="translate(340, 90)">
    <rect class="box" x="0" y="0" width="220" height="90" rx="14" fill="#ecfdf3" stroke="#bbf7d0"/>
    <text x="16" y="28" class="label">Builders</text>
    <text x="16" y="50" class="body">Implement reranker logic</text>
    <text x="16" y="70" class="body">Add UI knobs for weights</text>
  </g>

  <g transform="translate(340, 210)">
    <rect class="box" x="0" y="0" width="220" height="110" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="16" y="30" class="label">Evaluator</text>
    <text x="16" y="52" class="body">Runs MRR vs. RRF checks</text>
    <text x="16" y="72" class="body">Scores contrastive examples</text>
    <text x="16" y="92" class="body">Logs decisions for replay</text>
  </g>

  <g transform="translate(640, 120)">
    <rect class="box" x="0" y="0" width="200" height="90" rx="14" fill="#fef9c3" stroke="#fcd34d"/>
    <text x="16" y="28" class="label">Critic</text>
    <text x="16" y="50" class="body">Runs lint + tests</text>
    <text x="16" y="70" class="body">Flags missing imports</text>
  </g>

  <g transform="translate(640, 240)">
    <rect class="box" x="0" y="0" width="200" height="110" rx="14" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="16" y="30" class="label">Human review</text>
    <text x="16" y="52" class="body">Approves diffs</text>
    <text x="16" y="72" class="body">Tunes alpha, beta weights</text>
    <text x="16" y="92" class="body">Ships releases</text>
  </g>

  <line class="arrow" x1="260" y1="164" x2="340" y2="164"/>
  <line class="arrow" x1="260" y1="200" x2="340" y2="240"/>
  <line class="arrow" x1="560" y1="135" x2="640" y2="135"/>
  <line class="arrow" x1="560" y1="255" x2="640" y2="255"/>
  <line class="arrow" x1="840" y1="285" x2="840" y2="160" marker-end="url(#arrowhead)"/>
  <text x="854" y="220" class="body" transform="rotate(90 854 220)">feedback + new tickets</text>
</svg>
