<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="title desc">
  <title id="title">qareen multimodal rerank</title>
  <desc id="desc">Example of blending text and image scores with Weighted Linear Combination (alpha=0.6) before applying Maximum Marginal Relevance.</desc>
  <rect width="880" height="340" rx="16" fill="#f8fafc"/>
  <g font-family="'Inter','Helvetica','Arial',sans-serif" fill="#0f172a" font-size="18" font-weight="600" transform="translate(24,32)">
    <text x="0" y="0">qareen reranks by balancing relevance and diversity</text>
  </g>
  <g font-family="'Inter','Helvetica','Arial',sans-serif" font-size="13" fill="#0f172a" transform="translate(40,70)">
    <rect x="0" y="0" width="260" height="220" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="130" y="28" text-anchor="middle" font-weight="600">Candidate scores</text>
    <g font-size="12" fill="#1f2937">
      <text x="20" y="60" font-weight="600">ID</text>
      <text x="70" y="60" font-weight="600">Text sim</text>
      <text x="150" y="60" font-weight="600">Image sim</text>
      <text x="240" y="60" font-weight="600">Comment</text>
      <text x="20" y="82">A</text>
      <text x="70" y="82">0.82</text>
      <text x="150" y="82">0.48</text>
      <text x="240" y="82">clear caption</text>
      <text x="20" y="104">B</text>
      <text x="70" y="104">0.64</text>
      <text x="150" y="104">0.71</text>
      <text x="240" y="104">image fits</text>
      <text x="20" y="126">C</text>
      <text x="70" y="126">0.59</text>
      <text x="150" y="126">0.32</text>
      <text x="240" y="126">text-only</text>
    </g>
  </g>
  <g font-family="'Inter','Helvetica','Arial',sans-serif" font-size="13" fill="#0f172a" transform="translate(340,70)">
    <rect x="0" y="0" width="230" height="220" rx="12" fill="#ecfeff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="115" y="28" text-anchor="middle" font-weight="600">Blend scores</text>
    <text x="115" y="50" text-anchor="middle" fill="#334155">alpha = 0.6</text>
    <g font-size="12" fill="#1f2937">
      <text x="20" y="80">A: 0.6*0.82 + 0.4*0.48 = 0.68</text>
      <text x="20" y="102">B: 0.6*0.64 + 0.4*0.71 = 0.67</text>
      <text x="20" y="124">C: 0.6*0.59 + 0.4*0.32 = 0.48</text>
    </g>
    <text x="115" y="160" text-anchor="middle" font-size="12" fill="#334155">Normalized scores feed into MMR</text>
  </g>
  <g font-family="'Inter','Helvetica','Arial',sans-serif" font-size="13" fill="#0f172a" transform="translate(610,70)">
    <rect x="0" y="0" width="230" height="220" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="115" y="28" text-anchor="middle" font-weight="600">MMR rerank</text>
    <g font-size="12" fill="#1f2937">
      <text x="20" y="70">lambda = 0.7</text>
      <text x="20" y="94">Pick most relevant then penalize</text>
      <text x="20" y="112">near-duplicates.</text>
      <text x="20" y="146">Order in this example:</text>
      <text x="40" y="170">1) A (high relevance)</text>
      <text x="40" y="188">2) B (diverse image)</text>
      <text x="40" y="206">3) C (fallback)</text>
    </g>
  </g>
  <g stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#arrowQ)">
    <line x1="300" y1="180" x2="340" y2="180"/>
    <line x1="570" y1="180" x2="610" y2="180"/>
  </g>
  <defs>
    <marker id="arrowQ" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>
