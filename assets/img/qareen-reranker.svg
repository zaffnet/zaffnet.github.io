<svg width="760" height="420" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">qareen multimodal reranker</title>
  <desc id="desc">Shows how qareen mixes text and image signals with normalization, blending, and MMR-style diversification.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="url(#bg)"/>
  <text x="380" y="32" text-anchor="middle" font-family="'Inter', Arial" font-size="20" fill="#e2e8f0">How qareen blends modalities</text>
  <text x="380" y="52" text-anchor="middle" font-family="'Inter', Arial" font-size="13" fill="#94a3b8">Text scores + image scores → normalized → blended → diversified</text>

  <g transform="translate(60,90)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="160" height="90" rx="14" fill="#1e293b"/>
    <text x="80" y="26" text-anchor="middle" font-size="14">Retrieve candidates</text>
    <text x="80" y="48" text-anchor="middle">top-k captions</text>
    <text x="80" y="68" text-anchor="middle">top-k images</text>
  </g>

  <g transform="translate(260,70)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="200" height="120" rx="14" fill="#0ea5e9" opacity="0.9"/>
    <text x="100" y="24" text-anchor="middle" font-size="14">Normalize scores</text>
    <text x="100" y="48" text-anchor="middle">text = zscore(text)</text>
    <text x="100" y="68" text-anchor="middle">image = zscore(image)</text>
    <text x="100" y="92" text-anchor="middle">reduces modality scale drift</text>
  </g>

  <g transform="translate(520,70)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="160" height="120" rx="14" fill="#22c55e" opacity="0.9"/>
    <text x="80" y="24" text-anchor="middle" font-size="14">Blend signals</text>
    <text x="80" y="50" text-anchor="middle">alpha = 0.6</text>
    <text x="80" y="70" text-anchor="middle">score = alpha⋅text</text>
    <text x="80" y="90" text-anchor="middle"> + (1-alpha)⋅image</text>
  </g>

  <g transform="translate(180,240)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="200" height="110" rx="14" fill="#7c3aed" opacity="0.9"/>
    <text x="100" y="24" text-anchor="middle" font-size="14">Diversify</text>
    <text x="100" y="48" text-anchor="middle">MMR-style reranking</text>
    <text x="100" y="70" text-anchor="middle">balance relevance + novelty</text>
    <text x="100" y="92" text-anchor="middle">penalize near-duplicates</text>
  </g>

  <g transform="translate(440,240)" font-family="'Inter', Arial" fill="#e2e8f0" font-size="12">
    <rect x="0" y="0" width="220" height="110" rx="14" fill="#f97316" opacity="0.9"/>
    <text x="110" y="24" text-anchor="middle" font-size="14">Ranked few-shot set</text>
    <text x="110" y="48" text-anchor="middle">mix of text + image examples</text>
    <text x="110" y="68" text-anchor="middle">passes to LLM-as-a-Judge</text>
    <text x="110" y="88" text-anchor="middle">logs saved for replay</text>
  </g>

  <g stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity="0.85">
    <path d="M220 135 L260 135"/>
    <path d="M460 135 L520 135"/>
    <path d="M340 190 L340 240"/>
    <path d="M580 190 L580 240"/>
    <path d="M380 295 L440 295"/>
  </g>

  <g fill="#a5b4fc" font-family="'Inter', Arial" font-size="12">
    <text x="120" y="380">Weights and normalization come from the actual qareen reranker loop.</text>
  </g>
</svg>
